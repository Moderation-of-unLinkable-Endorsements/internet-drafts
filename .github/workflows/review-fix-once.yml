name: Validate EC-ACT review fixes
on:
  push:
    branches: [fix/ec-act-katz-review]
    paths: [.github/workflows/review-fix-once.yml]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'SamuelSchlesinger/internet-drafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Check the patch and unchanged code blocks
        run: |
          git diff --check b663bea8b2d93e01094177b015125cfb2046e101 HEAD
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          path = 'draft-authors-mole-ec-act.md'
          before = subprocess.check_output(['git', 'show', 'b663bea8b2d93e01094177b015125cfb2046e101:' + path], text=True)
          after = Path(path).read_text()
          blocks = lambda text: re.findall(r'^~~~[^\n]*\n.*?^~~~\s*$', text, re.M | re.S)
          assert blocks(before) == blocks(after)
          assert 'the maximum refund, and a *spend context*' not in after
          print('Pseudocode, wire formats, and test vectors unchanged.')
          PY
      - name: Build EC-ACT HTML
        uses: martinthomson/i-d-template@v1
        with:
          make: draft-authors-mole-ec-act.html
          token: ${{ github.token }}
      - name: Build EC-ACT text
        uses: martinthomson/i-d-template@v1
        with:
          make: draft-authors-mole-ec-act.txt
          token: ${{ github.token }}
