name: Reference implementation

on:
  pull_request:
    paths:
      - "poc/**"
      - ".github/workflows/poc.yml"
  push:
    paths:
      - "poc/**"
      - ".github/workflows/poc.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poc/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[test]'

      - name: Run tests
        run: pytest

      - name: Run linters
        run: |
          pyflakes src tests
          pylint --disable=all --enable=redefined-outer-name src tests

      - name: Run type checker
        run: mypy
